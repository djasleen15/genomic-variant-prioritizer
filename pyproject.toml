[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-variant-prioritizer"
version = "0.1.0"
description = "Rank somatic SNVs with a fine-tuned genomic language model"
requires-python = ">=3.11"

[project.scripts]
variant-prioritizer = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
